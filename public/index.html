<style>
  :root{
    --cream:#F1F7FD;
    --cream-2:#E1EFFB;
    --plum:#0F3A5F;
    --plum-2:#4C6E90;
    --raspberry:#1768B0;
    --raspberry-dark:#0F4C89;
    --pistachio:#2B7FC7;
    --pistachio-dark:#0F4C89;
    --amber:#5AA6DE;
    --amber-dark:#1768B0;
    --teal:#2B7FC7;
    --cherry:#D14B4B;
    --line:#C9DDF0;
    --card:#FFFFFF;
    --radius:16px;
    --shadow:0 2px 10px rgba(15,58,95,0.08), 0 1px 2px rgba(15,58,95,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--plum);
    font-family:'Plus Jakarta Sans', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    font-size:16px;
    line-height:1.5;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  #root{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
  ::selection{background:var(--raspberry);color:white;}

  /* ---------- login ---------- */
  .login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;gap:28px;}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
  .swirl{width:auto;height:120px;object-fit:contain;}
  .topbar-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .brand h1{font-size:30px;margin:0;color:var(--plum);}
  .brand p{margin:0;color:var(--plum-2);font-size:16px;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;border:1px solid var(--line);}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:14px;font-weight:700;color:var(--plum-2);text-transform:uppercase;letter-spacing:.04em;}
  input[type=text],input[type=password],input[type=number],input[type=tel],select,textarea{
    font-family:inherit;font-size:17px;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--cream);color:var(--plum);width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--raspberry);background:#fff;}
  textarea{resize:vertical;min-height:64px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:12px;padding:14px 18px;font-family:inherit;font-weight:700;font-size:17px;
    cursor:pointer;transition:transform .08s ease, opacity .15s ease;width:100%;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--raspberry);color:#fff;}
  .btn-primary:hover{background:var(--raspberry-dark);}
  .btn-outline{background:transparent;color:var(--plum);border:1.5px solid var(--line);}
  .btn-outline:hover{border-color:var(--plum-2);}
  .btn-ghost{background:transparent;color:var(--plum-2);width:auto;padding:8px 10px;font-size:15px;font-weight:600;}
  .btn-sm{width:auto;padding:9px 15px;font-size:15px;border-radius:9px;}
  .error-msg{color:var(--cherry);font-size:15px;font-weight:600;margin-top:-6px;margin-bottom:10px;}
  .hint{font-size:14px;color:var(--plum-2);opacity:.85;text-align:center;line-height:1.5;}

  /* ---------- app shell ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--plum);color:#fff;
    padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  }
  .topbar .who{display:flex;flex-direction:column;line-height:1.25;}
  .topbar .who b{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
  .topbar .who span{font-size:13px;opacity:.8;text-transform:uppercase;letter-spacing:.05em;}
  .topbar button{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
  .tabs{display:flex;gap:6px;padding:12px 16px 0;background:var(--cream);position:sticky;top:56px;z-index:19;}
  .tab{flex:1;text-align:center;padding:11px 8px;border-radius:12px 12px 0 0;font-size:15px;font-weight:700;color:var(--plum-2);cursor:pointer;background:var(--cream-2);border:1px solid var(--line);border-bottom:none;}
  .tab.active{background:var(--card);color:var(--plum);border-color:var(--line);position:relative;top:1px;}
  .content{flex:1;padding:18px 16px 90px;background:var(--card);border-top:1px solid var(--line);}

  /* ---------- generic ---------- */
  .section-title{font-size:14px;font-weight:800;color:var(--plum-2);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .empty{padding:30px 16px;text-align:center;color:var(--plum-2);font-size:16px;background:var(--cream);border-radius:var(--radius);border:1.5px dashed var(--line);}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{padding:8px 14px;border-radius:20px;font-size:14px;font-weight:700;border:1.5px solid var(--line);color:var(--plum-2);cursor:pointer;background:#fff;}
  .chip.active{background:var(--plum);color:#fff;border-color:var(--plum);}

  /* order item builder */
  .item-row{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;position:relative;}
  .item-row .rm{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--cherry);font-size:20px;cursor:pointer;font-weight:700;line-height:1;}
  .add-item-btn{border:1.5px dashed var(--raspberry);color:var(--raspberry-dark);background:#fff;border-radius:12px;padding:11px;text-align:center;font-weight:700;font-size:16px;cursor:pointer;margin-bottom:18px;}

  /* order cards */
  .order-card{border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:12px;background:#fff;}
  .order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .order-num{font-size:13px;color:var(--plum-2);font-weight:700;letter-spacing:.03em;}
  .order-client{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--plum);margin:1px 0 0;}
  .status-pill{padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .st-nuevo{background:#E3EEFB;color:#155A9C;}
  .st-en_proceso{background:#CFE3F7;color:#0F4C89;}
  .st-hecho_no_despachado{background:#BBD6F2;color:#0B3E73;}
  .st-despachado{background:#0F3A5F;color:#FFFFFF;}
  .st-problema{background:#FBE2E2;color:#B42323;}
  .order-items{font-size:15.5px;color:var(--plum-2);line-height:1.65;margin:6px 0;}
  .order-items b{color:var(--plum);}
  .order-meta{font-size:14px;color:var(--plum-2);display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 4px;}
  .order-note{background:var(--cream-2);border-left:3px solid var(--amber);padding:9px 11px;border-radius:6px;font-size:15px;margin-top:8px;}
  .order-problem{background:#FBE2E2;border-left:3px solid var(--cherry);padding:9px 11px;border-radius:6px;font-size:15px;margin-top:8px;color:#8A2E2E;}
  .order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;}

  /* stock */
  .stock-cat{margin-bottom:4px;}
  .stock-cat-head{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;cursor:pointer;border-bottom:1px solid var(--line);}
  .stock-cat-head b{font-family:'Fraunces',serif;font-size:17.5px;}
  .stock-cat-head .arrow{transition:transform .15s;color:var(--plum-2);}
  .stock-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--cream-2);}
  .stock-row .sname{font-size:16px;color:var(--plum);}
  .stock-row .sline{font-size:12.5px;color:var(--plum-2);display:block;}
  .stock-ctrl{display:flex;align-items:center;gap:8px;}
  .stock-ctrl button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:18px;font-weight:700;color:var(--plum);cursor:pointer;}
  .stock-ctrl input{width:60px;text-align:center;padding:7px 4px;font-size:16px;}
  .low{color:var(--cherry);font-weight:800;}

  .fab-save{position:sticky;bottom:0;background:linear-gradient(0deg,var(--card) 60%, rgba(255,255,255,0));padding:14px 0 4px;}

  .modal-bg{position:fixed;inset:0;background:rgba(15,58,95,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:560px;max-height:85vh;overflow:auto;}
  @media(min-width:600px){.modal-bg{align-items:center;}.modal{border-radius:18px;}}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--plum);color:#fff;padding:11px 20px;border-radius:20px;font-size:15px;font-weight:600;z-index:60;box-shadow:var(--shadow);}

  /* ---------- conexión, badges, alertas, check grande ---------- */
  .conn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;}
  .conn-ok{background:#3FCF6E;}
  .conn-bad{background:var(--cherry);}
  .tab-badge{display:inline-block;min-width:19px;padding:1px 5px;border-radius:10px;background:var(--cherry);color:#fff;font-size:11px;font-weight:800;margin-left:3px;vertical-align:middle;}
  .alert-banner{display:flex;align-items:center;gap:12px;border-radius:14px;padding:14px 16px;margin-bottom:14px;}
  .alert-danger{background:#FBE2E2;color:#8A2E2E;}
  .alert-warning{background:#FFF1DC;color:#8A5A1F;}
  .alert-banner b{font-size:15.5px;}
  .big-check-overlay{position:fixed;inset:0;background:rgba(15,58,95,.25);display:flex;align-items:center;justify-content:center;z-index:70;pointer-events:none;animation:fadeOutCheck 1s ease forwards;}
  .big-check{font-size:110px;animation:popCheck .35s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popCheck{from{transform:scale(0.3);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes fadeOutCheck{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;}}
  .flavor-swatch{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;font-size:18px;margin-right:10px;flex-shrink:0;}
  .help-step{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start;}
  .help-step .num{width:28px;height:28px;border-radius:50%;background:var(--raspberry);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
  @media print{
    body *{visibility:hidden;}
    #print-ticket, #print-ticket *{visibility:visible;}
    #print-ticket{position:absolute;top:0;left:0;width:100%;}
  }
</style>

/* ===== Adaptador de almacenamiento: conecta con nuestra propia base de datos en Vercel ===== */
window.storage = {
  async get(key, shared){
    let r;
    try{ r = await fetch('/api/storage?op=get&key='+encodeURIComponent(key)); }
    catch(e){ const err = new Error('network_error'); err.code = 'IO_ERROR'; throw err; }
    if(r.status===404){ const err = new Error('not_found'); err.code = 'NOT_FOUND'; throw err; }
    if(!r.ok){ const err = new Error('storage_error_'+r.status); err.code = 'IO_ERROR'; throw err; }
    return r.json();
  },
  async set(key, value, shared){
    let r;
    try{
      r = await fetch('/api/storage', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({op:'set', key, value})});
    }catch(e){ const err = new Error('network_error'); err.code = 'IO_ERROR'; throw err; }
    if(!r.ok){ const err = new Error('storage_error_'+r.status); err.code = 'IO_ERROR'; throw err; }
    return r.json();
  },
  async delete(key, shared){
    let r;
    try{
      r = await fetch('/api/storage', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({op:'delete', key})});
    }catch(e){ const err = new Error('network_error'); err.code = 'IO_ERROR'; throw err; }
    if(!r.ok){ const err = new Error('storage_error_'+r.status); err.code = 'IO_ERROR'; throw err; }
    return r.json();
  },
  async list(prefix, shared){
    let r;
    try{
      r = await fetch('/api/storage?op=list&prefix='+encodeURIComponent(prefix||''));
    }catch(e){ const err = new Error('network_error'); err.code = 'IO_ERROR'; throw err; }
    if(!r.ok){ const err = new Error('storage_error_'+r.status); err.code = 'IO_ERROR'; throw err; }
    return r.json();
  }
};

function stockKey(categoria, linea, sabor){ return `${categoria}|${linea||'-'}|${sabor}`; }

function buildStockCatalog(){
  const list = [];
  CATALOG.forEach(group=>{
    group.sabores.forEach((sabor, i)=>{
      list.push({id:stockKey(group.categoria,group.linea,sabor), categoria:group.categoria, linea:group.linea, sabor, precioDefault: group.precios[i]});
    });
  });
  return list;
}
const STOCK_CATALOG = buildStockCatalog();
function buildDefaultPrices(){
  const p = {};
  STOCK_CATALOG.forEach(s=>{ p[s.id] = s.precioDefault; });
  return p;
}

/* ============================= STORAGE ============================= */
let dataLoadError = false;
let dataLoadErrorDetail = '';

async function safeGetJSON(key){
  try{
    const r = await window.storage.get(key, true);
    return {ok:true, value: r.value};
  }catch(e){
    if(e && e.code === 'IO_ERROR'){ throw e; } // real connection/server error — must NOT be treated as "empty"
    return {ok:false, value:null}; // key genuinely doesn't exist yet (first run)
  }
}

async function loadAll(){
  dataLoadError = false;
  let stockRes, ordersRes, preciosRes;
  try{
    stockRes = await safeGetJSON('gelato:stock');
    ordersRes = await safeGetJSON('gelato:orders');
    preciosRes = await safeGetJSON('gelato:precios');
  }catch(e){
    // Something is actually broken (network/API down). Stop here — never seed or save,
    // or we'd overwrite real data with blank defaults.
    dataLoadError = true;
    dataLoadErrorDetail = (e && e.message) || 'No se pudo conectar con la base de datos.';
    dataLoaded = true;
    return;
  }

  stock = stockRes.ok ? JSON.parse(stockRes.value) : null;
  orders = ordersRes.ok ? JSON.parse(ordersRes.value) : null;
  precios = preciosRes.ok ? JSON.parse(preciosRes.value) : null;

  if(!stock){
    stock = {};
    STOCK_CATALOG.forEach(s=>{ stock[s.id] = 0; });
    await saveStock();
  } else {
    // ensure any new catalog items exist
    let changed=false;
    STOCK_CATALOG.forEach(s=>{ if(!(s.id in stock)){ stock[s.id]=0; changed=true; } });
    if(changed) await saveStock();
  }
  if(!precios){
    precios = buildDefaultPrices();
    await savePrecios();
  } else {
    let changed=false;
    STOCK_CATALOG.forEach(s=>{ if(!(s.id in precios)){ precios[s.id]=s.precioDefault; changed=true; } });
    if(changed) await savePrecios();
  }
  if(!orders){ orders = []; await saveOrders(); }
  dataLoaded = true;
}

async function saveStock(){ try{ await window.storage.set('gelato:stock', JSON.stringify(stock), true);}catch(e){ showToast('No se pudo guardar el inventario.'); } }
async function savePrecios(){ try{ await window.storage.set('gelato:precios', JSON.stringify(precios), true);}catch(e){ showToast('No se pudo guardar el precio.'); } }
async function saveOrders(){ try{ await window.storage.set('gelato:orders', JSON.stringify(orders), true);}catch(e){ showToast('No se pudo guardar el pedido.'); } }

async function refreshFromStorage(){
  try{
    const [sRes, oRes, pRes] = await Promise.allSettled([
      window.storage.get('gelato:stock', true),
      window.storage.get('gelato:orders', true),
      window.storage.get('gelato:precios', true),
    ]);
    if(sRes.status==='fulfilled' && sRes.value) stock = JSON.parse(sRes.value.value);
    if(oRes.status==='fulfilled' && oRes.value) orders = JSON.parse(oRes.value.value);
    if(pRes.status==='fulfilled' && pRes.value) precios = JSON.parse(pRes.value.value);
    render();
  }catch(e){ showToast('No se pudo actualizar. Revisa tu conexión.'); }
}

/* Sincronización automática entre los dos usuarios (Ventas/Producción):
   cada pocos segundos revisa si hay cambios nuevos guardados por el otro
   usuario y actualiza la pantalla sola, sin que nadie tenga que recargar. */
let autoRefreshBusy = false;
async function autoRefreshData(){
  if(!session || ui.view!=='app' || autoRefreshBusy) return;
  if(ui.modal) return; // no interrumpir si hay una ventana/modal abierta
  autoRefreshBusy = true;
  try{
    const [sRes, oRes, pRes] = await Promise.allSettled([
      window.storage.get('gelato:stock', true),
      window.storage.get('gelato:orders', true),
      window.storage.get('gelato:precios', true),
    ]);
    let changed = false;
    if(sRes.status==='fulfilled' && sRes.value){
      const v = JSON.parse(sRes.value.value);
      if(JSON.stringify(v)!==JSON.stringify(stock)){ stock = v; changed = true; }
    }
    if(oRes.status==='fulfilled' && oRes.value){
      const v = JSON.parse(oRes.value.value);
      if(JSON.stringify(v)!==JSON.stringify(orders)){ orders = v; changed = true; }
    }
    if(pRes.status==='fulfilled' && pRes.value){
      const v = JSON.parse(pRes.value.value);
      if(JSON.stringify(v)!==JSON.stringify(precios)){ precios = v; changed = true; }
    }
    if(changed){
      const activeTag = document.activeElement && document.activeElement.tagName;
      const isTyping = activeTag==='INPUT' || activeTag==='TEXTAREA';
      if(!isTyping){ render(); } // si está escribiendo, no le quitamos el cursor; se verá en el próximo refresco
    }
  }catch(e){ /* fallo silencioso: el punto de conexión ya avisa si hay problema de red */ }
  autoRefreshBusy = false;
}

/* ============================= HELPERS ============================= */
function showToast(msg){ ui.toast = msg; render(); setTimeout(()=>{ ui.toast=null; render(); }, 2400); }
function fmtDate(ts){ const d = new Date(ts); return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); }
function orderNumber(o){ return '#' + String(o.id).slice(-5); }
function money(n){ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(n||0)); }
function orderTotal(o){ return (o.items||[]).reduce((sum,it)=> sum + (it.precioUnit||0)*(it.cantidad||0), 0); }

function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

function computeBillingStats(){
  const now = new Date();
  const startThisMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const startLastMonth = new Date(now.getFullYear(), now.getMonth()-1, 1).getTime();
  const endLastMonth = startThisMonth;

  let hoy=0, mesActual=0, mesAnterior=0, pedidosHoy=0, pedidosMes=0;
  const clientes = {};

  orders.forEach(o=>{
    const total = orderTotal(o);
    const ts = o.creadoEn;
    if(isSameDay(new Date(ts), now)){ hoy += total; pedidosHoy++; }
    if(ts >= startThisMonth){ mesActual += total; pedidosMes++; }
    else if(ts >= startLastMonth && ts < endLastMonth){ mesAnterior += total; }

    const key = o.cliente.trim().toLowerCase();
    if(!clientes[key]) clientes[key] = {nombre:o.cliente.trim(), total:0, pedidos:0, ultimo:0, ciudad:o.ciudad};
    clientes[key].total += total;
    clientes[key].pedidos += 1;
    if(ts > clientes[key].ultimo){ clientes[key].ultimo = ts; clientes[key].ciudad = o.ciudad; }
  });

  const topClientes = Object.values(clientes).sort((a,b)=>b.total-a.total);
  const diff = mesActual - mesAnterior;
  const pct = mesAnterior>0 ? Math.round((diff/mesAnterior)*100) : (mesActual>0? 100: 0);

  return {hoy, mesActual, mesAnterior, diff, pct, pedidosHoy, pedidosMes, topClientes};
}

function itemsSummary(items){

}

function askDeleteOrder(orderId){
  const order = orders.find(o=>o.id===orderId);
  if(!order) return;
  const needsRestock = order.estado !== 'nuevo';
  const delta = needsRestock ? stockDeltaForOrder(order) : {};
  ui.modal = {type:'confirm-delete', orderId, needsRestock, delta, restock: needsRestock};
  render();
}

async function confirmDeleteOrder(orderId, doRestock, delta){
  if(doRestock){
    Object.keys(delta).forEach(id=>{ stock[id] = (stock[id]||0) + delta[id]; });
    await saveStock();
  }
  orders = orders.filter(o=>o.id!==orderId);
  await saveOrders();
  ui.modal = null;
  flashBigCheck();
  showToast('Pedido eliminado.');
  render();
}

function stockDeltaForOrder(order){
  // returns map id -> qty needed
  const map = {};
  order.items.forEach(it=>{
    const id = stockKey(it.categoria, it.linea, it.sabor);
    map[id] = (map[id]||0) + Number(it.cantidad||0);
  });
  return map;
}

async function takeOrder(orderId){
  const order = orders.find(o=>o.id===orderId);
  if(!order) return;
  const delta = stockDeltaForOrder(order);
  const short = [];
  Object.keys(delta).forEach(id=>{
    const have = stock[id]||0;
    if(have < delta[id]){
      const meta = STOCK_CATALOG.find(s=>s.id===id);
      short.push(`${meta? meta.sabor: id} (tienes ${have}, necesitas ${delta[id]})`);
    }
  });
  ui.modal = {type:'confirm-take', orderId, delta, short};
  render();
}

async function confirmTakeOrder(orderId, delta){
  const order = orders.find(o=>o.id===orderId);
  if(!order) return;
  Object.keys(delta).forEach(id=>{ stock[id] = (stock[id]||0) - delta[id]; });
  order.estado='en_proceso';
  order.historial.push({estado:'en_proceso', ts:Date.now(), por:session.name});
  await saveStock();
  await saveOrders();
  ui.modal=null;
  flashBigCheck();
  showToast('Pedido tomado. Inventario descontado.');
  render();
}

async function setStatus(orderId, estado){
  const order = orders.find(o=>o.id===orderId);
  if(!order) return;
  order.estado = estado;
  order.historial.push({estado, ts:Date.now(), por:session.name});

  await saveOrders();

function buildWhatsappText(o){
  const lineas = o.items.map(it=> `• ${it.cantidad} ${it.sabor}${it.linea? ' ('+it.linea+' · '+it.categoria+')' : ' ('+it.categoria+')'}`).join('\n');
  let txt = `*Pedido ${orderNumber(o)}*\n`;
  txt += `Cliente: ${o.cliente}\n`;
  txt += `Ciudad: ${o.ciudad || '-'}\n`;
  txt += `Enviado por: ${o.transportadora || '-'}\n\n`;
  txt += `Contenido del pedido:\n${lineas}`;
  return txt;
}

function copyTextRobust(text){
  return new Promise((resolve)=>{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>resolve(true)).catch(()=>resolve(fallbackCopy(text)));
    } else {
      resolve(fallbackCopy(text));
    }
  });
}
function fallbackCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

async function shareOrderWhatsapp(orderId){
  const order = orders.find(o=>o.id===orderId);
  if(!order) return;
  const text = buildWhatsappText(order);
  const win = window.open('', '_blank'); // open synchronously so popup blockers don't stop it
  const ok = await copyTextRobust(text);
  const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
  if(win) win.location.href = url; else window.open(url, '_blank');
  showToast(ok ? 'Pedido copiado. Abriendo WhatsApp...' : 'Se abrió WhatsApp con el pedido ya escrito.');
}

function csvEscape(v){
  const s = String(v==null?'':v);
  if(/[",\n;]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportOrdersCSV(){
  const headers = ['Numero','Fecha','Cliente','Ciudad','Transportadora','Contenido del pedido','Total','Estado'];
  const rows = orders.slice().sort((a,b)=>a.creadoEn-b.creadoEn).map(o=>{
    const contenido = o.items.map(it=> `${it.cantidad} ${it.sabor}${it.linea? ' ('+it.linea+' '+it.categoria+')':' ('+it.categoria+')'}`).join(' | ');
    return [orderNumber(o), new Date(o.creadoEn).toLocaleString('es-CO'), o.cliente, o.ciudad, o.transportadora, contenido, orderTotal(o), STATUS_LABELS[o.estado]];
  });
  const csvLines = [headers, ...rows].map(r=> r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csvLines], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gelato-mix-pedidos-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Descargando CSV... ábrelo con Excel o súbelo a Google Sheets.');
}

/* ============================= HANDLERS ============================= */
function attachAppHandlers(){
  const exportBtn = document.getElementById('btn-export-csv'); if(exportBtn) exportBtn.onclick = exportOrdersCSV;
  const bl = document.getElementById('btn-logout'); if(bl) bl.onclick = doLogout;
  const bh = document.getElementById('btn-help'); if(bh) bh.onclick = ()=>{ ui.modal = {type:'help'}; render(); };
  const biN = document.getElementById('btn-inicio-nuevo'); if(biN) biN.onclick = ()=>{ ui.tab='nuevo'; if(!ui.newOrder) ui.newOrder=newEmptyOrder(); render(); };

  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ ui.tab = el.dataset.tab; if(ui.tab==='nuevo' && !ui.newOrder) ui.newOrder=newEmptyOrder(); render(); };
  });

  // ---- new order form ----
  const fCliente = document.getElementById('f-cliente'); if(fCliente) fCliente.oninput = e=> ui.newOrder.cliente = e.target.value;
  const fCiudad = document.getElementById('f-ciudad'); if(fCiudad) fCiudad.oninput = e=> ui.newOrder.ciudad = e.target.value;
  const fTrans = document.getElementById('f-transportadora'); if(fTrans) fTrans.onchange = e=> ui.newOrder.transportadora = e.target.value;
  const fNotas = document.getElementById('f-notas'); if(fNotas) fNotas.oninput = e=> ui.newOrder.notas = e.target.value;

  document.querySelectorAll('[data-field]').forEach(el=>{
    el.onchange = (e)=>{
      const idx = Number(el.dataset.idx);
      const field = el.dataset.field;
      const it = ui.newOrder.items[idx];
      if(field==='categoria'){
        it.categoria = e.target.value;
        const group = CATALOG.find(g=>g.categoria===it.categoria);
        it.linea = group.linea;
        it.sabor = group.sabores[0];
      } else if(field==='linea'){
        it.linea = e.target.value;
      } else if(field==='sabor'){
        it.sabor = e.target.value;
      } else if(field==='cantidad'){
        it.cantidad = e.target.value;
      }
      render();
    };
  });
  document.querySelectorAll('[data-rm]').forEach(el=>{
    el.onclick = ()=>{ ui.newOrder.items.splice(Number(el.dataset.rm),1); render(); };
  });
  const addItem = document.getElementById('btn-add-item');
  if(addItem) addItem.onclick = ()=>{ ui.newOrder.items.push({categoria:'Helado Soft', linea:'Tradicional', sabor:HELADO_SABORES[0], cantidad:1}); render(); };
  const submitBtn = document.getElementById('btn-submit-order');
  if(submitBtn) submitBtn.onclick = submitNewOrder;

  // ---- orders tab ----
  const search = document.getElementById('f-search'); if(search) search.oninput = e=>{ ui.orderSearch = e.target.value; render(); };
  const searchHist = document.getElementById('f-search-hist'); if(searchHist) searchHist.oninput = e=>{ ui.orderSearch = e.target.value; render(); };
  document.querySelectorAll('[data-filter]').forEach(el=>{ el.onclick = ()=>{ ui.orderFilter = el.dataset.filter; render(); }; });
  document.querySelectorAll('[data-take]').forEach(el=>{ el.onclick = ()=> takeOrder(Number(el.dataset.take)); });
  document.querySelectorAll('[data-status]').forEach(el=>{
    el.onclick = ()=>{ const [id, st] = el.dataset.status.split('|'); setStatus(Number(id), st); };
  });
  document.querySelectorAll('[data-problem]').forEach(el=>{ el.onclick = ()=> openProblemModal(Number(el.dataset.problem)); });
  document.querySelectorAll('[data-resolve]').forEach(el=>{ el.onclick = ()=> resolveProblem(Number(el.dataset.resolve)); });
  document.querySelectorAll('[data-whatsapp]').forEach(el=>{ el.onclick = ()=> shareOrderWhatsapp(Number(el.dataset.whatsapp)); });
  document.querySelectorAll('[data-edit]').forEach(el=>{ el.onclick = ()=> startEditOrder(Number(el.dataset.edit)); });
  document.querySelectorAll('[data-delete]').forEach(el=>{ el.onclick = ()=> askDeleteOrder(Number(el.dataset.delete)); });
  document.querySelectorAll('[data-print]').forEach(el=>{ el.onclick = ()=>{ ui.modal = {type:'print', orderId:Number(el.dataset.print)}; render(); }; });
  const cancelEdit = document.getElementById('btn-cancel-edit'); if(cancelEdit) cancelEdit.onclick = cancelEditOrder;

  // ---- stock tab ----
  document.querySelectorAll('[data-cat]').forEach(el=>{
    el.onclick = ()=>{ const k = el.dataset.cat; ui.openCats[k] = !(ui.openCats[k]!==false); render(); };
  });
  document.querySelectorAll('[data-stockplus]').forEach(el=>{ el.onclick = ()=> bumpStock(el.dataset.stockplus, 1); });
  document.querySelectorAll('[data-stockminus]').forEach(el=>{ el.onclick = ()=> bumpStock(el.dataset.stockminus, -1); });
  document.querySelectorAll('[data-stockval]').forEach(el=>{ el.onchange = ()=> setStockValue(el.dataset.stockval, el.value); });
  document.querySelectorAll('[data-priceval]').forEach(el=>{ el.onchange = ()=> setPriceValue(el.dataset.priceval, el.value); });

  // ---- modal ----
  const bg = document.getElementById('modal-bg');
  if(bg){
    bg.onclick = (e)=>{ if(e.target.id==='modal-bg'){ ui.modal=null; render(); } };
    const cancel = document.getElementById('modal-cancel'); if(cancel) cancel.onclick = ()=>{ ui.modal=null; render(); };
    const confirmTake = document.getElementById('modal-confirm-take');
    if(confirmTake) confirmTake.onclick = ()=> confirmTakeOrder(ui.modal.orderId, ui.modal.delta);
    const ptext = document.getElementById('modal-problem-text');
    if(ptext) ptext.oninput = e=> ui.modal.text = e.target.value;
    const psubmit = document.getElementById('modal-confirm-problem');
    if(psubmit) psubmit.onclick = ()=> submitProblem(ui.modal.orderId, ui.modal.text);
    const restockCheck = document.getElementById('modal-restock-check');
    if(restockCheck) restockCheck.onchange = e=> ui.modal.restock = e.target.checked;
    const confirmDelete = document.getElementById('modal-confirm-delete');
    if(confirmDelete) confirmDelete.onclick = ()=> confirmDeleteOrder(ui.modal.orderId, ui.modal.needsRestock && ui.modal.restock, ui.modal.delta);
    const doPrint = document.getElementById('modal-do-print');
    if(doPrint) doPrint.onclick = ()=> window.print();
  }
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================= INIT ============================= */
(async function init(){
  render();
  await loadAll();
  ui.view = 'login';
  render();
  checkConnection();
  setInterval(checkConnection, 20000);
  setInterval(autoRefreshData, 8000);
  window.addEventListener('online', ()=>{ checkConnection(); autoRefreshData(); });
  window.addEventListener('offline', ()=>{ ui.online=false; render(); });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ checkConnection(); autoRefreshData(); } });
})();
</script>
